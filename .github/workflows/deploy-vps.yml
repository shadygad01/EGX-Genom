name: Deploy to self-hosted VPS

# Auto-deploys the private/self-hosted instance (AD-57's permanent
# "local-only/self-hosted" option, just hosted remotely) whenever main
# changes something the VPS actually serves. Completely separate from
# deploy-pages.yml -- the public GitHub Pages site -- which this workflow
# never touches. Requires three repo secrets (Settings > Secrets and
# variables > Actions), none of which this workflow or any Claude session
# can set on your behalf -- see deploy/README.md's "Continuous deployment"
# section for the one-time setup:
#   VPS_HOST      the server to SSH into (e.g. 162.245.186.123)
#   VPS_USER      the SSH user (root, or a dedicated deploy user)
#   VPS_SSH_KEY   the private half of a keypair whose public half is in
#                 that user's ~/.ssh/authorized_keys on the VPS
#
# If these secrets are not set, every run fails immediately and loudly
# (never silently skips) -- same "fail loudly rather than publish a
# broken/stale result" posture as deploy-pages.yml's own live-data gate.

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "api/**"
      - "web/**"
      - "research/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are configured
        run: |
          missing=()
          [ -z "${{ secrets.VPS_HOST }}" ] && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_USER }}" ] && missing+=("VPS_USER")
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing+=("VPS_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]}. See deploy/README.md's 'Continuous deployment' section."
            exit 1
          fi

      - name: Pull latest code and rebuild on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/egx-genom
            git fetch origin main
            git reset --hard origin/main
            # Untracked runtime state (research/data/knowledge.json,
            # events.json, runs.json, shadow_fund.json, the dashboard
            # export dir, etc. -- everything egx-collector.service
            # produces) is never touched: `reset --hard` only affects
            # tracked files, and none of these are tracked. Never add
            # `git clean` here, or it wipes that state.
            cd research && uv sync --frozen && cd ..
            npm ci
            npm run build -w api
            npm run build -w web -- --mode selfhosted
            bash deploy/systemd/install.sh

      - name: Verify the deployment actually works
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "--- systemd unit status ---"
            systemctl is-active egx-api.service
            systemctl is-active egx-collector.timer
            systemctl is-active nginx
            echo "--- API health (direct) ---"
            curl -fsS http://127.0.0.1:3001/health
            echo
            echo "--- API health (through nginx /api/) ---"
            curl -fsS http://127.0.0.1/api/health
            echo
            echo "--- Dashboard site (through nginx /EGX-Genom/) ---"
            code=$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1/EGX-Genom/)
            echo "HTTP $code"
            [ "$code" = "200" ]
            echo "--- Live decision route wiring (expect JSON, not a 501 'not configured') ---"
            curl -fsS -X POST http://127.0.0.1/api/decisions \
              -H 'Content-Type: application/json' \
              -d "{\"date\":\"$(date +%F)\"}" | head -c 300
            echo
            echo "VERIFICATION PASSED"
