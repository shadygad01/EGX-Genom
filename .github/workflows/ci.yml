name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  research:
    name: Python research engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - name: Truth Preservation static analysis (AD-60)
        run: uv run python scripts/check_truth_preservation.py
      - run: uv run pytest
      - name: Check contracts/ is up to date with the pydantic schema
        run: |
          uv run python scripts/export_schemas.py
          git diff --exit-code -- ../contracts || {
            echo "::error::contracts/ is stale. Run 'uv run python research/scripts/export_schemas.py'," \
                 "commit the result, and update api/src/types.ts and web/src/types.ts to match."
            exit 1
          }
      - name: Artifact provenance gate (AD-64) -- web/public/data changes need a canonical manifest
        run: uv run python scripts/check_artifact_provenance.py

  api-and-web:
    name: TypeScript api + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build -w api
      - run: npm run test -w api
      - run: npm run build -w web
      - run: npm run test -w web
