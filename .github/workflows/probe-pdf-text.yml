name: Probe PDF text (diagnostic, manual only)

# Ad hoc, manually-triggered diagnostic -- fetches real, already-discovered
# company financial-statement/earnings-release PDFs (see
# research/scripts/probe_pdf_text.py's TARGETS dict for the exact URLs and
# their provenance) and prints their extracted text to this run's own logs.
# Writes nothing to any tracked file, creates no SourceSpec, produces no
# dashboard artifact -- purely evidence-gathering so a real Family B PDF
# parser (docs/COLLECTOR_TEMPLATE_TAXONOMY.md) can be written against real
# extracted text instead of a guess.
#
# First used 2026-08-03 (run 30810863486) to build
# collectors.company_earnings_table.CompanyEarningsTablePdfCollector for
# rmda_ir/tmgh_ir (see AD-61, TD-32). Kept as a reusable tool, not deleted:
# TD-32's own repayment trigger is to update TARGETS with a remaining
# Family B company's real URLs (JUFO/ORWE/EAST/ADIB/CCAP/ORHD) and re-run
# this workflow before writing or extending any parser for it -- never by
# guessing that company's likely phrasing.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Install research package
        working-directory: research
        run: uv sync

      - name: Fetch and print real PDF text
        working-directory: research
        run: uv run python scripts/probe_pdf_text.py
