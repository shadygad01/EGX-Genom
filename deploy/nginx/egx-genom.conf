# EGX-Genom self-hosted deployment (private VPS instance, not the public
# GitHub Pages site -- see AD-57 / CLAUDE.md). Serves the web/dist build
# under /EGX-Genom/ (matching vite.config.ts's hardcoded production `base`,
# which is the same on every target, GitHub Pages or not) and reverse-proxies
# /api/ to the egx-api.service Fastify process on 127.0.0.1:3001.
#
# Install: copy to /etc/nginx/sites-available/egx-genom.conf, symlink into
# sites-enabled, `nginx -t`, then `systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Convenience redirect so the bare host also lands on the app.
    location = / {
        return 302 /EGX-Genom/;
    }

    # ApiProvider.ts always fetches from site root ("/api/..."), never
    # "/EGX-Genom/api/...", regardless of the /EGX-Genom/ base path -- this
    # location must stay at root to match.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /decisions and /capital-allocation shell out to `uv run` + the
        # research pipeline synchronously -- give them real headroom instead
        # of nginx's 60s default proxy_read_timeout.
        proxy_read_timeout 90s;
    }

    location /EGX-Genom/ {
        alias /opt/egx-genom/web/dist/;
        try_files $uri $uri/ /EGX-Genom/index.html;
    }
}
