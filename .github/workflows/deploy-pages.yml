name: Deploy web dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "research/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Free daily refresh (no deployment target/scheduler required -- GitHub
  # Actions cron is free for a public repo): 15:30 UTC is after EGX's
  # Sun-Thu close (Africa/Cairo, UTC+2/+3) so each day's run picks up that
  # session's close before the next one opens, without waiting on a push.
  schedule:
    - cron: "30 15 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      # Fails loudly here if the repo's Pages source isn't set to "GitHub
      # Actions" (Settings > Pages > Build and deployment), instead of the
      # site silently continuing to serve whatever the legacy branch-based
      # builder last published.
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv sync

      # Cross-run persistence (TD-40): without this, `--data-dir` below
      # would be a brand-new, empty directory every single day -- every
      # calendar day's research cycle would start from an empty
      # KnowledgeStore/AlphaGenome/EventRepository/run ledger, never
      # carrying yesterday's promoted knowledge or accumulated news/event
      # history forward, even though real multi-year price history has
      # always been available. Same restore-before-run discipline
      # discovery.yml already uses for its own data, just auto-committed
      # (never PR-gated) -- this is accumulated operational state, not
      # evidence for a human to review line by line.
      - name: Restore prior production state from production/state-latest
        run: |
          mkdir -p data/production
          if git ls-remote --exit-code --heads origin production/state-latest > /dev/null 2>&1; then
            git fetch origin production/state-latest
            git archive origin/production/state-latest -- data/production | tar -x || true
            if compgen -G 'data/production/raw_documents.json.gz.part-*' > /dev/null; then
              cat data/production/raw_documents.json.gz.part-* > data/production/raw_documents.json.gz
              rm data/production/raw_documents.json.gz.part-*
            fi
            if [ -f data/production/raw_documents.json.gz ]; then
              gzip -d data/production/raw_documents.json.gz
            fi
            if compgen -G 'data/production/provenance_index.json.gz.part-*' > /dev/null; then
              cat data/production/provenance_index.json.gz.part-* > data/production/provenance_index.json.gz
              rm data/production/provenance_index.json.gz.part-*
            fi
            if [ -f data/production/provenance_index.json.gz ]; then
              gzip -d data/production/provenance_index.json.gz
            fi
          fi

      # Persistence means today's date could already have a SUCCEEDED
      # RunRecord in the state just restored (e.g. this workflow's own
      # `schedule` trigger and a same-day `push` trigger both firing) --
      # `RuntimeEngine.run_day` has no built-in same-date dedup (by
      # design: `run_range` replay/backfill needs to be able to re-run a
      # date on purpose), so re-running the research pipeline here would
      # append a second, near-duplicate set of hypotheses/findings for a
      # date already recorded. Checked via the real `RunRecordRepository`
      # model, not a hand-rolled JSON scan.
      - name: Check whether today's date already ran
        id: check_run
        run: |
          # A code push must rebuild with the new decision logic even when a
          # scheduled data run already succeeded today.  Deduplication is only
          # valid for the schedule trigger; applying it to pushes previously
          # left Pages serving old code and old recommendations indefinitely.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ALREADY_RAN=$(uv run python -c "
          from datetime import date
          from agx_research.runtime.engine import RunRecordRepository, RunStatus
          runs = RunRecordRepository('data/production/runs.json').all_latest()
          today = date.today()
          print('true' if any(r.run_date == today and r.status == RunStatus.SUCCEEDED for r in runs) else 'false')
          ")
          echo "already_ran=$ALREADY_RAN" >> "$GITHUB_OUTPUT"

      # Runs the complete production pipeline against REAL public market
      # data -- this is the single entry point (`agx run`), unchanged in
      # shape from every prior mock-mode run: Source Registry -> Discovery
      # Engine -> Collector Selection/Execution -> Raw Archive -> Canonical
      # Transformation -> Validation -> Event Platform -> Market Memory ->
      # Knowledge Base -> Research Pipeline -> Genome -> Investment Case
      # Generator -> Dashboard Artifact Generator -> Mission Control ->
      # Execution Report. `--mode live` (the CLI's default) fetches real
      # EGX composite price provider/FRED/World Bank data over the network;
      # price fallback is evaluated per UniverseProvider ticker across
      # Yahoo, StockAnalysis and a post-close Mubasher snapshot. A source with no
      # verified live endpoint yet (EGX official, company IR, news outlets)
      # reports UNAVAILABLE with its reason in `collector_status.json`
      # rather than being silently skipped, and every other collector keeps
      # running regardless (graceful degradation, never a silent mock
      # fallback -- see docs/DATA_ACQUISITION.md). If zero live sources
      # succeed, `agx run` exits non-zero and this step -- and the whole
      # deployment -- fails loudly rather than publish an empty or stale
      # dashboard. Default (non-permissive) gate thresholds are used, so an
      # honest "nothing promoted yet" from real data is an expected result,
      # not a failure.
      - name: Run the complete production pipeline (live data)
        if: steps.check_run.outputs.already_ran != 'true'
        run: |
          uv run python -m agx_research.cli --data-dir data/production \
            run --date "$(date -u +%F)" --mode live --dashboard-out ../web/public/data

      # Today already has a SUCCEEDED run in the persisted state (see the
      # check above, e.g. this workflow's own `schedule` trigger and a
      # same-day `push` trigger both firing) -- today's Pages deployment
      # already published from that earlier run, so every remaining step
      # (including `deploy`, gated the same way below) is skipped rather
      # than rebuilding/republishing a redundant, no-new-information build.
      # `export-dashboard` was deliberately not used as a "regenerate only"
      # fallback here: it writes the older, narrower Epoch I/II artifact
      # set (`write_dashboard_artifacts`), not the full production set this
      # job's own "Verify build output" step requires (execution_report,
      # collector_status, acquisition_decisions, mission_status, ...) --
      # producing a broken partial deploy is worse than skipping outright.

      # discovery_report.json/discovery_metrics.json/endpoint_candidates.json
      # are written by the separate, weekly .github/workflows/discovery.yml
      # (via a reviewed PR, never a direct commit) -- not by agx run. They're
      # already final-shaped JSON committed to the repo, so this is a plain
      # copy, never a Python re-export. Absent on any deploy before the first
      # Discovery PR merges -- an honest gap, not a missing step; the
      # dashboard renders an empty state until then.
      - name: Copy Discovery workflow evidence into the dashboard data dir (if present)
        if: steps.check_run.outputs.already_ran != 'true'
        run: |
          for f in discovery_report.json discovery_metrics.json endpoint_candidates.json; do
            if [ -f "data/discovery/$f" ]; then
              cp "data/discovery/$f" "../web/public/data/$f"
            fi
          done

      - name: Validate dashboard JSON artifacts
        if: steps.check_run.outputs.already_ran != 'true'
        # Publishing partial, explicitly measured coverage is valid. The
        # validator still rejects malformed, stale, or internally inconsistent
        # financial artifacts; missing tickers remain visible in the coverage
        # report instead of blocking the whole dashboard deployment.
        run: uv run python -m agx_research.cli validate-dashboard --dir ../web/public/data

      # Persist today's updated state (TD-40) now that it's run and passed
      # dashboard validation -- auto-committed, never PR-gated (this is
      # accumulated operational state, not evidence for a human to review
      # line by line, unlike discovery.yml's/news-history-backfill.yml's
      # data). `git checkout -B` always branches fresh off the `main` HEAD
      # already checked out above rather than off any prior
      # `production/state-latest` history, so the branch never accumulates
      # its own growing commit history -- only the restore-then-run above
      # makes the underlying data *content* (knowledge/genome/events/etc.)
      # accumulate across days; each day's commit here is a fresh single
      # snapshot, same discipline as discovery.yml's own `discovery/latest`.
      - name: Persist updated production state to production/state-latest
        if: steps.check_run.outputs.already_ran != 'true'
        working-directory: .
        run: |
          git config user.name "agx-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B production/state-latest
          # Raw-document provenance is highly compressible JSON but can exceed
          # GitHub's 100 MiB per-blob limit uncompressed. Preserve it losslessly
          # on the state branch and restore it before the next run above.
          if [ -f research/data/production/raw_documents.json ]; then
            gzip -9 research/data/production/raw_documents.json
            split -b 90m research/data/production/raw_documents.json.gz \
              research/data/production/raw_documents.json.gz.part-
            rm research/data/production/raw_documents.json.gz
          fi
          # provenance_index.json (ProvenanceIndexRepository: one record per
          # artifact_type/key/record_date, so it grows with every ticker's
          # every collected day) crossed GitHub's *hard* 100 MiB blob limit
          # for the first time on 2026-08-01, silently rejecting this push
          # (pre-receive hook decline) and skipping every step after it,
          # including the actual dashboard build/deploy -- same compressible-
          # JSON profile as raw_documents.json above, same fix. See TD-63:
          # gzip buys headroom, it does not cap the underlying growth.
          if [ -f research/data/production/provenance_index.json ]; then
            gzip -9 research/data/production/provenance_index.json
            split -b 90m research/data/production/provenance_index.json.gz \
              research/data/production/provenance_index.json.gz.part-
            rm research/data/production/provenance_index.json.gz
          fi
          git add research/data/production/
          if ! git diff --cached --quiet; then
            git commit -m "Production state: $(date -u +%F)"
            git push --force origin production/state-latest
          fi
          git checkout -B main

      # Acquisition-architecture audit/verification is complete and frozen
      # (see docs/ACQUISITION_STRATEGY.md's "Final Data Acquisition Sprint"
      # section) -- the verbose per-target discovery-reason loop, the raw
      # domain-hint probes, and the IMF/OECD endpoint probes that built that
      # evidence trail were one-off investigation steps for that sprint, not
      # standing production infrastructure; they added ~50+ minutes to every
      # deploy for questions already answered with documented, stable
      # (evidence won't change run to run) findings. Removed. What's kept
      # below is fast (local JSON reads, no extra network calls) and
      # genuinely useful for monitoring any future deploy's health.
      - name: Show per-collector live results
        if: steps.check_run.outputs.already_ran != 'true'
        run: |
          uv run python -c "
          import json
          rows = json.load(open('../web/public/data/collector_status.json'))
          by_status = {}
          for r in rows:
              by_status.setdefault(r['status'], []).append(r)
          print({k: len(v) for k, v in by_status.items()})
          for status in ['COLLECTED', 'DEGRADED', 'FAILED']:
              for r in by_status.get(status, []):
                  print(f\"  {status:<11} {r['source_id']:<15} connected={r['connection_success']} \"
                        f\"parsed={r['parse_success']} yield={r['yield']} events={r['events_produced']} \"
                        f\"health={r['health_status']} quality={r['data_quality_score']} reason={r['reason']}\")
          for r in by_status.get('UNAVAILABLE', []):
              print(f\"  UNAVAILABLE {r['source_id']:<15} {r['reason']}\")
          "
          echo '--- execution report: overall status, stages, warnings ---'
          uv run python -c "
          import json
          report = json.load(open('../web/public/data/execution_report.json'))
          print('overall_status:', report['overall_status'])
          for s in report['stages']:
              print(f\"  {s['name']:<28} {s['status']:<10} {s['detail']}\")
          print('warnings:')
          for w in report['warnings']:
              print(' -', w)
          "
      - name: Show acquisition decisions (every capability, ranked strategies, outcome)
        if: steps.check_run.outputs.already_ran != 'true'
        run: |
          uv run python -c "
          import json
          decisions = json.load(open('../web/public/data/acquisition_decisions.json'))
          for d in decisions:
              print(f\"{d['capability']:<25} succeeded={d['succeeded']} selected={d['selected_source_ids']}\")
              for a in d['attempts']:
                  print(f\"    rank={a['rank']:<2} {a['source_id']:<20} {a['outcome']:<10} \"
                        f\"score={a['composite_score']:.3f} {a['reason']}\")
          "

      - run: npm install
        if: steps.check_run.outputs.already_ran != 'true'
        working-directory: .
      - run: npm run build -w web
        if: steps.check_run.outputs.already_ran != 'true'
        working-directory: .

      - name: Verify build output has an index.html and every production artifact at its root
        if: steps.check_run.outputs.already_ran != 'true'
        working-directory: .
        run: |
          test -f web/dist/index.html
          test -f web/dist/404.html
          for f in knowledge events patterns recommendations universe market_state runtime_metrics \
                   system_status source_registry investment_cases collector_status \
                   runtime_status dashboard_metrics mission_status execution_report \
                   decision_readiness ticker_data_gap_report source_truth \
                   decision_performance decision_history system_maturity \
                   financial_statements financial_coverage; do
            test -f "web/dist/data/$f.json"
          done

      - uses: actions/upload-pages-artifact@v3
        if: steps.check_run.outputs.already_ran != 'true'
        with:
          path: web/dist

    outputs:
      already_ran: ${{ steps.check_run.outputs.already_ran }}

  deploy:
    needs: build
    # The `github-pages` environment's default deployment-branch policy
    # only allows `main` to deploy; a manual workflow_dispatch test run on
    # any other branch would otherwise fail this job instantly (0 steps
    # ever run) with a misleading top-level workflow "failure", even though
    # `build` (the actual production pipeline run) succeeded. Gate it
    # explicitly so a feature-branch test run reports an honest "skipped"
    # deploy instead of a false failure. Also skipped outright when `build`
    # found today's date already ran (see its own steps.check_run) --
    # nothing new to publish, and no `upload-pages-artifact` was produced.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.already_ran != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
