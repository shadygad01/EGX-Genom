name: Deploy web dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "research/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      # Fails loudly here if the repo's Pages source isn't set to "GitHub
      # Actions" (Settings > Pages > Build and deployment), instead of the
      # site silently continuing to serve whatever the legacy branch-based
      # builder last published.
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv sync

      # Runs the complete production pipeline against REAL public market
      # data -- this is the single entry point (`agx run`), unchanged in
      # shape from every prior mock-mode run: Source Registry -> Discovery
      # Engine -> Collector Selection/Execution -> Raw Archive -> Canonical
      # Transformation -> Validation -> Event Platform -> Market Memory ->
      # Knowledge Base -> Research Pipeline -> Genome -> Investment Case
      # Generator -> Dashboard Artifact Generator -> Mission Control ->
      # Execution Report. `--mode live` (the CLI's default) fetches real
      # Stooq/FRED/World Bank data over the network; a source with no
      # verified live endpoint yet (EGX official, company IR, news outlets)
      # reports UNAVAILABLE with its reason in `collector_status.json`
      # rather than being silently skipped, and every other collector keeps
      # running regardless (graceful degradation, never a silent mock
      # fallback -- see docs/DATA_ACQUISITION.md). If zero live sources
      # succeed, `agx run` exits non-zero and this step -- and the whole
      # deployment -- fails loudly rather than publish an empty or stale
      # dashboard. Default (non-permissive) gate thresholds are used, so an
      # honest "nothing promoted yet" from real data is an expected result,
      # not a failure.
      - name: Run the complete production pipeline (live data)
        run: |
          uv run python -m agx_research.cli --data-dir /tmp/agx_dashboard_data \
            run --date "$(date -u +%F)" --mode live --dashboard-out ../web/public/data

      - name: Validate dashboard JSON artifacts
        run: uv run python -m agx_research.cli validate-dashboard --dir ../web/public/data

      # Per the mission's verification requirement: for every collector,
      # show connected/downloaded/parsed/validated (or the exact reason it
      # didn't), directly in the job log -- not just the one-line summary
      # `agx run` prints. Genuinely useful for ongoing production
      # monitoring, not only for this phase's own verification.
      - name: Show per-target Egyptian discovery reasons
        run: |
          for t in egx_official cbe enterprise_press mubasher zawya; do
            uv run python -m agx_research.cli --data-dir /tmp/agx_dashboard_data \
              discover-sources --target "$t" || true
          done

      - name: Raw probe of the exact domain hints (diagnosing "no reachable domain")
        run: |
          uv run python -c "
          from agx_research.collectors.fetcher import HttpFetcher, FetchDisallowed, FetchError
          from agx_research.sources.spec import (
              AccessMethod, RateLimit, RetryPolicy, SourceCategory, SourceSpec, SourceStatus,
          )
          spec = SourceSpec(
              id='probe_diag', name='probe', category=SourceCategory.RESEARCH,
              access_method=AccessMethod.HTML_SCRAPE, status=SourceStatus.IMPLEMENTED,
              reliability_score=0.0, freshness_score=0.0,
              retry_policy=RetryPolicy(max_attempts=1, backoff_seconds=0.5),
              rate_limit=RateLimit(requests_per_minute=20, min_seconds_between_requests=1.0),
          )
          fetcher = HttpFetcher()
          for url in [
              'https://egx.com.eg', 'https://www.egx.com.eg',
              'https://enterprise.press', 'https://www.enterprise.press',
              'https://mubasher.info', 'https://www.mubasher.info',
              'https://cbe.org.eg', 'https://zawya.com',
          ]:
              try:
                  text = fetcher.fetch_text(url, spec)
                  print(f'{url}: OK, {len(text)} chars, starts: {text[:120]!r}')
              except FetchDisallowed as exc:
                  print(f'{url}: ROBOTS_DISALLOWED: {exc}')
              except FetchError as exc:
                  print(f'{url}: FETCH_ERROR: {exc}')
              except Exception as exc:
                  print(f'{url}: {type(exc).__name__}: {exc}')
          "

      - name: Show per-collector live results
        run: |
          uv run python -c "
          import json
          rows = json.load(open('../web/public/data/collector_status.json'))
          by_status = {}
          for r in rows:
              by_status.setdefault(r['status'], []).append(r)
          print({k: len(v) for k, v in by_status.items()})
          for status in ['COLLECTED', 'DEGRADED', 'FAILED']:
              for r in by_status.get(status, []):
                  print(f\"  {status:<11} {r['source_id']:<15} connected={r['connection_success']} \"
                        f\"parsed={r['parse_success']} yield={r['yield']} events={r['events_produced']} \"
                        f\"health={r['health_status']} quality={r['data_quality_score']} reason={r['reason']}\")
          for r in by_status.get('UNAVAILABLE', []):
              print(f\"  UNAVAILABLE {r['source_id']:<15} {r['reason']}\")
          "
          echo '--- execution report: overall status, stages, warnings ---'
          uv run python -c "
          import json
          report = json.load(open('../web/public/data/execution_report.json'))
          print('overall_status:', report['overall_status'])
          for s in report['stages']:
              print(f\"  {s['name']:<28} {s['status']:<10} {s['detail']}\")
          print('warnings:')
          for w in report['warnings']:
              print(' -', w)
          "
          echo '--- Egyptian priority-source registry state after this run ---'
          uv run python -c "
          import json
          registry = json.load(open('../web/public/data/source_registry.json'))
          by_id = {}
          for spec in registry:
              by_id[spec['id']] = spec
          for source_id in ['egx_official', 'cbe', 'enterprise_press', 'mubasher', 'zawya']:
              spec = by_id.get(source_id)
              if spec:
                  print(f\"  {source_id:<18} status={spec['status']:<10} lifecycle={spec['lifecycle_state']:<10} \"
                        f\"health={spec['health_status']:<8} base_url={spec['base_url']}\")
          "
          echo '--- raw stooq response + parse warnings (diagnosing zero price bars) ---'
          uv run python -c "
          from agx_research.collectors.raw import RawDocumentRepository
          from agx_research.collectors.stooq import StooqPriceCollector
          from agx_research.sources.registry import SourceRegistry
          from agx_research.sources.catalog import seed_registry
          docs = RawDocumentRepository('/tmp/agx_dashboard_data/raw_documents.json')
          stooq_docs = [d for d in docs.all_latest() if d.source_id == 'stooq']
          print(f'{len(stooq_docs)} stooq raw document(s) archived')
          registry = seed_registry(SourceRegistry('/tmp/agx_dashboard_data/source_registry.json'))
          spec = registry.latest('stooq')
          collector = StooqPriceCollector(spec, symbols={})
          for d in stooq_docs[:3]:
              print(f'--- {d.original_url} ---')
              print(repr(d.content_text[:500]))
              batch = collector.parse(d)
              print(f'parsed: {len(batch.price_bars)} price bar(s); warnings: {batch.parse_warnings}')
          "

      - run: npm install
        working-directory: .
      - run: npm run build -w web
        working-directory: .

      - name: Verify build output has an index.html and every production artifact at its root
        working-directory: .
        run: |
          test -f web/dist/index.html
          for f in knowledge events patterns recommendations market_state runtime_metrics \
                   system_status source_registry investment_cases collector_status \
                   runtime_status dashboard_metrics mission_status execution_report; do
            test -f "web/dist/data/$f.json"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    # The `github-pages` environment's default deployment-branch policy
    # only allows `main` to deploy; a manual workflow_dispatch test run on
    # any other branch would otherwise fail this job instantly (0 steps
    # ever run) with a misleading top-level workflow "failure", even though
    # `build` (the actual production pipeline run) succeeded. Gate it
    # explicitly so a feature-branch test run reports an honest "skipped"
    # deploy instead of a false failure.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
