name: Deploy web dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "research/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      # Fails loudly here if the repo's Pages source isn't set to "GitHub
      # Actions" (Settings > Pages > Build and deployment), instead of the
      # site silently continuing to serve whatever the legacy branch-based
      # builder last published.
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv sync

      # Runs the complete production pipeline -- this is the single entry
      # point (`agx run`) that will later run unchanged in a live
      # deployment: Source Registry -> Discovery Engine -> Collector
      # Selection/Execution -> Raw Archive -> Canonical Transformation ->
      # Validation -> Event Platform -> Market Memory -> Knowledge Base ->
      # Research Pipeline -> Genome -> Investment Case Generator ->
      # Dashboard Artifact Generator -> Mission Control -> Execution Report.
      # Collector Execution runs in --mode mock (production-ready execution
      # against clearly-synthetic, wire-format-correct fixtures standing in
      # for a licensed EGX vendor -- see docs/DATA_ACQUISITION.md); this is
      # mechanically real pipeline output end to end, only as "real" as the
      # mock data feeding it (see docs/PHASE_STATUS.md). Default
      # (non-permissive) gate thresholds are used, so an honest "nothing
      # promoted yet" is an expected result, not a failure.
      - name: Run the complete production pipeline
        run: |
          uv run python -m agx_research.cli --data-dir /tmp/agx_dashboard_data \
            run --date 2026-06-14 --mode mock --dashboard-out ../web/public/data

      - name: Validate dashboard JSON artifacts
        run: uv run python -m agx_research.cli validate-dashboard --dir ../web/public/data

      - run: npm install
        working-directory: .
      - run: npm run build -w web
        working-directory: .

      - name: Verify build output has an index.html and every production artifact at its root
        working-directory: .
        run: |
          test -f web/dist/index.html
          for f in knowledge events patterns recommendations market_state runtime_metrics \
                   system_status source_registry investment_cases collector_status \
                   runtime_status dashboard_metrics mission_status execution_report; do
            test -f "web/dist/data/$f.json"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
